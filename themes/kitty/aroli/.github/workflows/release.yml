name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: kitty.conf
          generate_release_notes: true
          body: |
            Uso: `include <caminho>/kitty.conf` no seu `kitty.conf`,
            depois `Ctrl+Shift+F5` para recarregar.
