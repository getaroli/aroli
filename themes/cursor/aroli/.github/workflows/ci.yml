name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Verify cursor integrity and publish visual review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install cursor build dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick libxcursor-dev build-essential pkg-config
      - name: Verify generated anatomy and compiled cursors
        run: make check
      - name: Generate SVG preview
        run: bun scripts/generate-preview.ts
      - name: Render visual review
        run: |
          bun scripts/verify-cursors.ts /tmp/aroli-cursor-sheet.svg
          rsvg-convert /tmp/aroli-cursor-sheet.svg -o /tmp/aroli-cursor-sheet.png
          rsvg-convert preview.svg -o /tmp/aroli-cursor-preview.png
          rsvg-convert silhouettes.svg -o /tmp/aroli-silhouettes.png
      - name: Verify generated file is committed
        run: git diff --exit-code -- preview.svg
      - name: Publish preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: aroli-pointer-preview
          path: |
            preview.svg
            /tmp/aroli-cursor-sheet.svg
            /tmp/aroli-cursor-sheet.png
            /tmp/aroli-cursor-preview.png
            silhouettes.svg
            /tmp/aroli-silhouettes.png
          if-no-files-found: error
