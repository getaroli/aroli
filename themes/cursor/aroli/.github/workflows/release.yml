name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install cursor build dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick libxcursor-dev build-essential pkg-config
      - name: Build and verify cursors
        run: make check
      - name: Package installable tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          tar -czf "aroli-pointer-${TAG}.tar.gz" cursors index.theme README.md LICENSE CHANGELOG.md
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "aroli-pointer-*.tar.gz"
          generate_release_notes: true
          body: |
            Instalação manual: extraia em `~/.icons/Aroli` (ou
            `~/.local/share/icons/Aroli`) e selecione o tema `Aroli`
            nas configurações do seu ambiente.
