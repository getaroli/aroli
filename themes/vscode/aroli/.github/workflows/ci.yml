name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Package extension
        run: bunx --bun @vscode/vsce package --no-dependencies
      - name: Check artifact matches manifest version
        run: test -f "aroli-themes-$(node -p "require('./package.json').version").vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: aroli-themes-vsix
          path: "*.vsix"
          if-no-files-found: error
