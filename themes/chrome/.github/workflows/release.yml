name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Check tag matches both manifests
        run: |
          DARK=$(node -p "require('./aroli-dark/manifest.json').version")
          BLACK=$(node -p "require('./aroli-black/manifest.json').version")
          test "$DARK" = "$BLACK"
          test "${GITHUB_REF_NAME}" = "v${DARK}"
      - name: Package both variants
        run: bun package-chrome.ts
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aroli-dark/aroli-dark-*.zip
            aroli-black/aroli-black-*.zip
          generate_release_notes: true
          body: |
            Upload manual na Chrome Web Store: um item por variante
            (Dark e Black), com o `store/icon-128.png` de cada pasta
            nos campos da ficha da loja.
