name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: starship.toml
          generate_release_notes: true
          body: |
            Uso isolado: `STARSHIP_CONFIG=<caminho>/starship.toml starship prompt`.
            Permanente: faça merge no seu `~/.config/starship.toml` e use
            `palette = "aroli"`.
