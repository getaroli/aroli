name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate collection
        run: |
          python3 - <<'EOF'
          import os
          for required, kind in (('aroli-encaixe.png', 'PNG'), ('aroli-encaixe.svg', 'SVG')):
              assert os.path.isfile(required), f'missing {required}'
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  p = os.path.join(root, f)
                  with open(p, 'rb') as fh:
                      head = fh.read(8)
                  if f.endswith('.png'):
                      assert head[:8] == b'\x89PNG\r\n\x1a\n', f'bad PNG: {p}'
                  elif f.endswith('.svg'):
                      rest = fh.read(4096)
                      assert b'<svg' in head + rest, f'bad SVG: {p}'
                  elif f.endswith('.mp4'):
                      assert head[4:8] == b'ftyp', f'bad MP4: {p}'
          print('OK: encaixe set present, all PNG/SVG/MP4 magic bytes valid')
          EOF
      - name: List collection
        run: ls -la *.png *.svg *.mp4 | tee /tmp/backdrops.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aroli-backdrops-encaixe
          path: |
            aroli-encaixe.png
            aroli-encaixe.svg
          if-no-files-found: error
