name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checksums
        run: sha256sum aroli-encaixe.png aroli-encaixe.svg > SHA256SUMS.txt
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aroli-encaixe.png
            aroli-encaixe.svg
            SHA256SUMS.txt
          generate_release_notes: true
