name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install font toolchain
        run: pip install fonttools brotli
      - name: Build and verify
        run: bun run build && bun run verify
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AroliSans-Regular.otf
            dist/AroliSans-Regular.woff2
            dist/AroliSans-Medium.otf
            dist/AroliSans-Medium.woff2
            dist/AroliSans-SemiBold.otf
            dist/AroliSans-SemiBold.woff2
            dist/AroliSans-Bold.otf
            dist/AroliSans-Bold.woff2
          generate_release_notes: true
